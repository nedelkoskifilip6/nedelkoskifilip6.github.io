<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="All selected projects and digital work by Filip Nedelkoski, in one place.">
  <title>Filip Nedelkoski — Projects</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#ffffff; color:#101114; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:32px 20px; }
    main { width:min(100%, 760px); }
    .eyebrow { font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:18px 0 12px; font-size:clamp(42px, 9vw, 76px); line-height:.98; letter-spacing:-.065em; }
    .intro { max-width:480px; line-height:1.7; font-size:15px; }
    .project { margin-top:46px; border:1px solid #e3e4e6; border-radius:18px; overflow:hidden; background:#ffffff; }
    .project a { min-height:112px; padding:25px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; color:inherit; text-decoration:none; transition:background .25s ease,border-color .25s ease; }
    .project a:hover { background:#f5f5f5; }
    .project a:focus-visible { outline:2px solid #101114; outline-offset:-4px; border-radius:18px; }
    .project-copy { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px 14px; } .project-name { font-size:20px; font-weight:650; letter-spacing:-.025em; }
    .project-type { display:inline-flex; align-items:center; gap:10px; margin-top:0; font-size:10px; letter-spacing:.16em; text-transform:uppercase; } .project-type::before { content:""; width:16px; height:1px; background:currentColor; }
    .project-link { font-size:14px; white-space:nowrap; }
    footer { margin-top:64px; font-size:12px; }
    @media (max-width:480px) { .project a { align-items:flex-start; flex-direction:column; gap:18px; padding:24px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Selected projects &amp; work</p>
    <h1>Projects.</h1>
    <p class="intro">All my selected projects and digital work, in one place.</p>
    <section class="project" aria-label="Projects">
      <a href="/revolut-finance/">
        <span class="project-copy"><span class="project-name">Revolut Finance</span><span class="project-type">Independent fintech concept</span></span>
        <span class="project-link">Open project</span>
      </a>
    </section>
    <footer>© Filip Nedelkoski</footer>
  </main>
</body>
</html>

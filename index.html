<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090a">
  <meta name="description" content="Selected independent digital projects by Filip Nedelkoski.">
  <title>Filip Nedelkoski — Projects</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#08090a; color:#f4f4f4; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:32px 20px; }
    main { width:min(100%, 760px); }
    .eyebrow { color:#a4a6aa; font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:18px 0 12px; font-size:clamp(42px, 9vw, 76px); line-height:.98; letter-spacing:-.065em; }
    .intro { max-width:480px; color:#a4a6aa; line-height:1.7; font-size:15px; }
    .project { margin-top:46px; border:1px solid #34363a; border-radius:18px; overflow:hidden; background:linear-gradient(135deg,#17191c,#0c0d0f); }
    .project a { min-height:112px; padding:25px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; color:inherit; text-decoration:none; transition:background .25s ease,border-color .25s ease; }
    .project a:hover { background:#202226; }
    .project-copy { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px 14px; } .project-name { font-size:20px; font-weight:650; letter-spacing:-.025em; }
    .project-type { display:inline-flex; align-items:center; gap:10px; margin-top:0; color:#a8abb1; font-size:10px; letter-spacing:.16em; text-transform:uppercase; } .project-type::before { content:""; width:16px; height:1px; background:#ee3b43; opacity:.85; }
    .project-link { color:#ee3b43; font-size:14px; }
    footer { margin-top:64px; color:#74777d; font-size:12px; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Selected work · 2026</p>
    <h1>Projects.</h1>
    <p class="intro">Independent digital concepts by Filip Nedelkoski. Each project has its own address.</p>
    <section class="project" aria-label="Projects">
      <a href="/tesla-motors/">
        <span class="project-copy"><span class="project-name">Tesla Motors</span><span class="project-type">Portfolio concept</span></span>
        <span class="project-link">Open project ↗</span>
      </a>
    </section>
    <footer>© 2026 Filip Nedelkoski</footer>
  </main>
</body>
</html>
